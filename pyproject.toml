[project]
name = "diagram-lint"
version = "1.0.0"
description = "An agent skill for creating draw.io and Mermaid diagrams as code with layout checks & linting."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "T20", "SIM", "RUF"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["skills/diagram-lint/scripts"]
relative_files = true

[tool.pytest-gremlins]
paths = ["skills/diagram-lint/scripts"]
